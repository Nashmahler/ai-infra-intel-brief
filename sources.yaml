# Sources: free feeds only, no logins.
# Run `python -m src.check_feeds` to confirm each URL returns items.
# Feeds that fail the check are removed from this file.

feeds:
  - name: Data Center Dynamics
    url: https://www.datacenterdynamics.com/en/rss/
  - name: Utility Dive
    url: https://www.utilitydive.com/feeds/news/
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/

# Removed because no working URL could be confirmed (add back once one is):
#  - Data Center Frontier: https://www.datacenterfrontier.com/feed/ returned
#    a 301 then an XML error; the current RSS address is unknown.
#  - The Register data centre: .../data_centre/headlines.atom returned 404.
#    Unverified candidates: https://www.theregister.com/headlines.atom (site-wide)
#    and https://www.theregister.com/on_prem/headlines.atom

# Every Google News search (shared + the profile's) is fetched through this
# template ({query} is URL-encoded).
google_news_template: https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en

# Shared industry searches (company/product names only; generic words like
# 'utility' would drown the brief in noise). Searches specific to the target
# company live in its profile (profiles/<name>.yaml, `google_news_terms`).
google_news_terms:
  - CoreWeave
  - Nebius
  - ERCOT
  - "data center moratorium"
  - "Nvidia GPU"
  - "Oracle data center"
  - "hyperscaler capex"
  - "data center power"
  - "Texas data center policy"
  - "data center ballot measure"

# SEC EDGAR filings are not in v1 (they need a contact User-Agent); see README, "What's next".
