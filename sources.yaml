# Sources: free feeds only, no logins.
# Run `python -m src.check_feeds` to confirm each URL returns items.
# Feeds that fail the check are removed from this file.

feeds:
  - name: Data Center Dynamics
    url: https://www.datacenterdynamics.com/en/rss/
  - name: Utility Dive
    url: https://www.utilitydive.com/feeds/news/
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/

# Removed because no working URL could be confirmed (add back once one is):
#  - Data Center Frontier: https://www.datacenterfrontier.com/feed/ returned
#    a 301 then an XML error; the current RSS address is unknown.
#  - The Register data centre: .../data_centre/headlines.atom returned 404.
#    Unverified candidates: https://www.theregister.com/headlines.atom (site-wide)
#    and https://www.theregister.com/on_prem/headlines.atom

# One Google News RSS search per watchlist term is generated from watchlist.yaml
# at fetch time using this template ({query} is URL-encoded).
google_news_template: https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en

# Terms that get their own Google News search (company/product names only;
# generic words like 'utility' would drown the brief in noise).
google_news_terms:
  - CoreWeave
  - Nebius
  - Crusoe
  - Stargate
  - ERCOT
  - "Abilene data center"
  - "data center moratorium"
  - "Nvidia GPU"
  - "Oracle data center"
  - "hyperscaler capex"
  - "data center power"

# SEC EDGAR filings (Atom). The SEC blocks anonymous clients: set the
# SEC_USER_AGENT environment variable / repository secret to something like
#   crusoe-intel-brief your-email@example.com
# These feeds are skipped (and reported) while it is unset.
edgar:
  - name: SEC EDGAR CoreWeave
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001769628&type=&dateb=&owner=include&count=20&output=atom
  - name: SEC EDGAR Nebius
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001513845&type=&dateb=&owner=include&count=20&output=atom
  - name: SEC EDGAR Oracle
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001341439&type=&dateb=&owner=include&count=20&output=atom
