# Daily brief, built any time from 6:00 to 11:59 a.m. Mountain time.
# fetch -> rank -> decode Google links (top 60) -> full text -> write -> verify ->
# (Fridays) weekly themes -> index,
# then commit briefs/<profile>/YYYY-MM-DD.md, the briefs index, and the README's
# "Latest brief" link to the repo.
# Runs on the schedule and from the "Run workflow" button (manual).
# Pushes to v1-build that edit this file run the pipeline as a test but do NOT commit.
name: Daily brief

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving. 6am Mountain is 13:00 UTC
    # in winter (MST) and 12:00 UTC in summer (MDT), so fire at both times. GitHub
    # can also start scheduled runs late, so the "gate" step (src/gate.py) lets a
    # scheduled run through any time from 6:00 to 11:59 a.m. Denver, but only if
    # today's brief is not already on main. That makes the second cron a safe retry:
    # whichever starts first builds the brief, the other finds it and stops.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also add this week's themes and opportunities (normally only on Fridays)"
        type: boolean
        default: false
      commit:
        description: "Commit the brief to the repo (untick for a test run that leaves nothing behind)"
        type: boolean
        default: true
  push:
    # Early testing: run when this file changes (cents per run, not per push).
    branches: [v1-build]
    paths: [".github/workflows/daily-brief.yml"]

permissions:
  contents: write   # lets the job commit the brief to the repo

concurrency:
  group: daily-brief          # never run two at once (e.g. schedule + manual)
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Which company the brief is prepared for. Set a repository VARIABLE named
      # TARGET_PROFILE to change it; unset means the default profile (crusoe).
      TARGET_PROFILE: ${{ vars.TARGET_PROFILE }}
    steps:
      # Checkout and install come first because the gate looks for today's brief in
      # the checked-out repo (a scheduled run always checks out main).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Gate (scheduled runs go from 6:00 to 11:59 a.m. Denver, unless today's brief exists)
        id: gate
        run: python -m src.gate
      - name: Test
        if: steps.gate.outputs.go == 'true'
        run: python -m pytest -q
      - name: Fetch
        if: steps.gate.outputs.go == 'true'
        run: python -m src.fetch
      - name: Rank
        if: steps.gate.outputs.go == 'true'
        run: python -m src.rank
      - name: Decode Google News links for the top 60 ranked stories
        # Unofficial decoder that talks to Google: never blocks the brief. If it fails,
        # stories keep their Google link (and a warning appears on the run page).
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: python -m src.decode
      - name: Fetch full text of the top articles
        if: steps.gate.outputs.go == 'true'
        run: python -m src.fulltext
      - name: Write draft
        if: steps.gate.outputs.go == 'true'
        run: python -m src.write
      - name: Verify and publish (runs even if an earlier step failed, so it fails closed)
        if: steps.gate.outputs.go == 'true' && always()
        run: python -m src.verify
      - name: Weekly themes (Fridays, or when asked for in a manual run)
        # Never blocks the daily brief: if this fails, the brief is committed as it was.
        if: steps.gate.outputs.go == 'true' && always()
        continue-on-error: true
        run: python -m src.weekly
        env:
          FORCE_WEEKLY: ${{ inputs.weekly }}
      - name: Update the briefs index and the README's latest link
        if: steps.gate.outputs.go == 'true' && always()
        continue-on-error: true
        run: python -m src.index
      - name: Show the brief in the log and the run summary
        if: steps.gate.outputs.go == 'true' && always()
        continue-on-error: true
        run: |
          f="briefs/${TARGET_PROFILE:-crusoe}/$(TZ=America/Denver date +%F).md"
          if [ -f "$f" ]; then
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit brief to briefs/
        # Scheduled runs always commit; manual runs commit unless "commit" is unticked.
        # Pushes (test runs of this file) never do. Commits made with the built-in
        # token do not trigger other workflows, so there is no loop.
        if: steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.commit == true) && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs/ README.md
          if git diff --cached --quiet; then
            echo "No new brief to commit."
          else
            git commit -m "Daily brief $(TZ=America/Denver date +%F) (${TARGET_PROFILE:-crusoe})"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Save outputs for inspection
        if: steps.gate.outputs.go == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-data
          path: |
            data/
            briefs/
          if-no-files-found: warn
