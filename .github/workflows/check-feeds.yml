# Manual-only: confirms every feed in sources.yaml returns items, from
# GitHub's runners (which have open internet). Run it from the Actions tab.
name: Check feeds

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.check_feeds
