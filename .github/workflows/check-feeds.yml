# Confirms every feed in sources.yaml returns items, from
# GitHub's runners (which have open internet). Runs on every push to v1-build, or manually from the Actions tab.
name: Check feeds

on:
  workflow_dispatch:   # manual button (appears once this file is on main)
  push:
    branches: [v1-build]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m src.check_feeds
        env:
          TARGET_PROFILE: ${{ vars.TARGET_PROFILE }}   # feeds include the profile's own searches
