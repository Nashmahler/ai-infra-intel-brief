# Checks the ranker against the hand-labeled headlines (SPEC.md section 6).
# Runs the real ranking step on evals/labeled_headlines.yaml and reports agreement,
# false positives and false negatives in the log and on the run page. Re-run it
# after every change to the ranking prompt. Costs a few cents (one ranking call).
name: Ranker eval

on:
  workflow_dispatch:       # Actions -> Ranker eval -> Run workflow
    inputs:
      file:
        description: "Which labeled file to score (evals/labeled_headlines.yaml, or evals/heldout_headlines.yaml for the held-out set)"
        type: string
        default: "evals/labeled_headlines.yaml"
      runs:
        description: "How many times to rank the 20 headlines (the ranker varies run to run; 3 is a fairer number)"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TARGET_PROFILE: ${{ vars.TARGET_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the eval
        run: python -m src.evaluate --file "${{ inputs.file || 'evals/labeled_headlines.yaml' }}" --runs "${{ inputs.runs || '1' }}"
