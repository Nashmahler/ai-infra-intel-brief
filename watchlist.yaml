# Shared watchlist: the industry markets every profile tracks.
# Terms specific to the target company live in its profile (profiles/<name>.yaml).
# Edit this file to change what the brief tracks; no code changes needed.
# Matching is case-insensitive and on whole words/phrases.

markets:
  ai_compute_cloud:
    label: "AI compute & cloud"
    terms: [CoreWeave, "Lambda Labs", "Lambda Cloud", Nebius, "Together AI", "Oracle Cloud", AWS,
            "Microsoft Azure", "Google Cloud", OpenAI, Stargate, Anthropic, xAI]
  power_energy:
    label: "Power & energy"
    terms: ["power purchase agreement", PPA, "data center power", "nuclear",
            "natural gas", "interconnection queue", FERC, ERCOT]
  data_center_construction:
    label: "Data center construction"
    terms: ["hyperscale campus", Abilene, "modular data center",
            "data center moratorium", "data center permitting",
            "data center land", "data center ballot"]
  chips_hardware:
    label: "Chips & hardware"
    terms: [Nvidia, AMD, GPU, Blackwell, Rubin, HBM, Broadcom, "custom silicon"]
